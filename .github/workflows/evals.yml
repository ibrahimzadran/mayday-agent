name: evals

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Both on purpose. 3.14 defers annotation evaluation (PEP 649), so a
        # name used only in an annotation can be missing and the module still
        # imports; 3.12 raises at import. Testing one version hides bugs the
        # other would catch, in both directions.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the airline API
        run: |
          python -m uvicorn backend.main:app --port 8001 &
          for i in $(seq 30); do curl -sf localhost:8001/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8001/health

      - name: Annotations resolve
        # Cheap, needs no API key, and catches the class of bug that only
        # appears on one interpreter.
        run: PYTHONPATH=. python tests_annotations.py

      - name: Consent gate
        # No model involved, so this runs without an API key and is the
        # cheapest signal on the one irreversible action.
        run: PYTHONPATH=. python tests_consent_gate.py

      - name: Identity gate
        run: |
          curl -sf -X POST localhost:8001/admin/reset >/dev/null
          PYTHONPATH=. python tests_identity_gate.py

      - name: Build policy index
        if: matrix.python-version == '3.12' && env.GOOGLE_API_KEY != ''
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
        run: python -m mayday.policy_index

      - name: Fast eval suite
        # One version only — the suite spends model quota, and quota is per
        # model not per job. Skipped without a key so forks get a skip rather
        # than a confusing red.
        if: matrix.python-version == '3.12' && env.GOOGLE_API_KEY != ''
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
          MAYDAY_CHAOS_RATE: "0"
        run: PYTHONPATH=. python -m evals --fast --pause 20
